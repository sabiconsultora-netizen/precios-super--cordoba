name: Precios SEPA Córdoba

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bajar el último archivo del SEPA
        shell: python
        run: |
          import json, re, sys, os, zipfile, urllib.request, shutil
          UA = {'User-Agent': 'Mozilla/5.0 (precios-cordoba; datos abiertos SEPA)'}
          def get(url, timeout=120):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=timeout)
          url = None
          # 1) API del portal de datos
          try:
              r = json.load(get('https://datos.produccion.gob.ar/api/3/action/package_show?id=sepa-precios'))
              recs = [x for x in r['result']['resources'] if str(x.get('url','')).lower().endswith('.zip') or 'zip' in str(x.get('format','')).lower()]
              recs.sort(key=lambda x: x.get('last_modified') or x.get('metadata_modified') or x.get('created') or '')
              print('Recursos zip encontrados:', len(recs))
              for x in recs[-7:]: print('  ', x.get('name'), '|', x.get('last_modified') or x.get('created'), '|', x.get('url'))
              if recs: url = recs[-1]['url']
          except Exception as e:
              print('La API no respondió bien:', repr(e))
          # 2) si no, buscar los links .zip en la página del dataset
          if not url:
              try:
                  html = get('https://datos.produccion.gob.ar/dataset/sepa-precios').read().decode('utf-8', 'ignore')
                  links = re.findall(r'href="([^"]+\.zip)"', html)
                  print('Links .zip en la página:', len(links))
                  if links: url = links[-1]
              except Exception as e:
                  print('La página del dataset no respondió:', repr(e))
          if not url:
              print('::error::No encontré el archivo del SEPA. El portal puede estar caído o bloqueando la descarga.'); sys.exit(1)
          print('Bajando:', url)
          with get(url, timeout=600) as resp, open('sepa.zip', 'wb') as f:
              shutil.copyfileobj(resp, f, 1024*1024)
          tam = os.path.getsize('sepa.zip'); print(f'Tamaño: {tam/1e6:.1f} MB')
          if not zipfile.is_zipfile('sepa.zip'):
              print('::error::Lo que bajó no es un zip. Primeros bytes:', open('sepa.zip','rb').read(300)); sys.exit(1)
          # descomprimir, y adentro un zip por comercio
          os.makedirs('sepa', exist_ok=True)
          with zipfile.ZipFile('sepa.zip') as z: z.extractall('sepa')
          n = 0
          for raiz, _, archivos in os.walk('sepa'):
              for a in archivos:
                  if a.lower().endswith('.zip'):
                      p = os.path.join(raiz, a)
                      try:
                          with zipfile.ZipFile(p) as z: z.extractall(p[:-4]); n += 1
                      except Exception as e:
                          print('No se pudo abrir', p, repr(e))
          print('Comercios descomprimidos:', n)

      - name: Quedarse con Córdoba
        run: node sepa-cordoba.mjs sepa docs/cordoba.json

      - name: Publicar
        run: |
          git config user.name  "sepa-bot"
          git config user.email "sepa-bot@users.noreply.github.com"
          git add docs/cordoba.json
          git diff --cached --quiet || git commit -m "Precios SEPA Córdoba $(date +%F)"
          git push
